<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 1</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Project1</legend>
        <h1>Event Registration</h1>
        <label for="Name">Name:</label>
        <br />
        <input type="text" id="Name" />
        <br />
        <label for="Email">Email:</label>
        <br />
        <input type="text" id="Email" />
        <br />
        <label for="Phone">Phone:</label>
        <br />
        <input type="text" id="Phone" />
        <br />
        <label for="Occupation">Occupation:</label>
        <br />
        <select name="Occupation" id="Occupation">
          <option value="Frontend Developer">Frontend Developer</option>
          <option value="Backend Developer">Backend Developer</option>
          <option value="Full-Stack Developer">Full-Stack Developer</option>
          <option value="Other">Other</option>
        </select>
        <br />
        <label for="Interest">Topic of Interest: </label>
        <br />
        <label>Topic of Interest:</label>
        <br />
        <input type="checkbox" name="interest" id="html" value="HTML" />
        <label for="html">HTML</label>
        <br />
        <input type="checkbox" name="interest" id="css" value="CSS" />
        <!-- id should always be different. -->
        <label for="css">CSS</label>
        <br />
        <input type="checkbox" name="interest" id="js" value="JavaScript" />
        <label for="js">JavaScript</label>
        <br />
        <label for="comments">Comments: </label>
        <br />
        <textarea name="Comments" id="comments"></textarea>
        <button type="button">Register</button>
      </fieldset>
    </form>
  </body>
</html>
