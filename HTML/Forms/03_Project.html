<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project 3</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Project3</legend>
        <h1>Complex Form</h1>
        <fieldset>
          <legend>Personal Information</legend>
          <label for="Name">Name</label>
          <input type="text" id="Name" placeholder="Enter your Name" />
          <label for="Email">Email</label>
          <input type="email" id="Email" placeholder="Enter your Email" />
          <label for="Phone">Phone</label>
          <input type="tel" id="Phone" placeholder="Enter your Phone Number" />
          <label for="DoB">Date Of Birth</label>
          <input type="date" id="DoB" />
          <label for="gender">Gender</label>
          <label for="male">Male</label>
          <input type="radio" id="male" name="gender" />
          <label for="female">Female</label>
          <input type="radio" id="female" name="gender" />
          <label for="Country">Country</label>
          <select name="Country" id="Country">
            <option value="C1">USA</option>
            <option value="C2">UAE</option>
            <option value="C3">India</option>
            <option value="C4">Canada</option>
            <option value="C5">Others</option>
          </select>
        </fieldset>
        <fieldset>
          <legend>Address:</legend>
          <label for="Street">Street</label>
          <input type="text" id="Street" placeholder="Enter your Street" />
          <label for="City">City</label>
          <input type="text" id="City" placeholder="Enter your City" />
          <label for="State">State</label>
          <input type="text" id="State" placeholder="Enter your State" />
          <label for="Zip-Code">Zip Code</label>
          <input type="text" id="Zip-Code" placeholder="Enter your Zip Code" />
        </fieldset>
        <fieldset>
          <legend>Other Information</legend>
          <label for="comments">Comments</label>
          <br />
          <textarea
            name="Comments"
            id="comments"
            placeholder="Suggest your Comments"
          ></textarea>
          <input type="checkbox" id="agreement" value="agreement" />
          <label for="agreement">I agree to the terms of service</label>
        </fieldset>
        <button type="button">Submit</button>
      </fieldset>
    </form>
  </body>
</html>
