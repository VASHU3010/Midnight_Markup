<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Media</title>
  </head>
  <body>
    <section class="image">
      <!-- img TAG IS USED TO ADD THE IMAGE IN HTML DOCUMENT. -->
      <img src="" alt="logo image" width="500px" height="50px" loading="lazy" />
      <br>
      <!-- LOADING  LAZY :: Don't load this image/iframe immediately. Load it when it's close to becoming visible on the screen. -->
      <audio src="" alt="audio file" controls></audio>
      <br>
      <!-- <AUDIO> TAG is used to add the audio  file with attribute controls. -->
      <audio controls>
        <source src="" type="audio" />
      </audio>
      <br>
      <!-- <video> tag is used to add the video in our project html file with control attribute. -->
      <video src="" alt="video file" controls></video>
      <br>
      <video controls>
        <source src="" type="video" />
        </video>
        <br>
        <!-- to embed another html document. -->
         <iframe src="../HTML Projects/01_Resume.html" width="700" height="500" title="embed page"> page </iframe>
         <br>
      <iframe src="https://www.youtube.com/embed/fb4rgYbi84c?list=PLDzeHZWIZsTo0wSBcg4-NMIbC0L8evLrD&index=12" frameborder="0" ></iframe>
      <!-- for yt video to embed , you meed to remove watch and replace with embed and remove v= too, keep only the video id. -->
       <!-- after vid id , remove & and add ?-->
    </section>
  </body>
</html>
