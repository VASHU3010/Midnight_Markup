<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Tag</title>
</head>
<body>
    <!-- In HRML, there are 2 types of lists - 
     1. Ordered Lists : where items are to be stored in an ordered way, that might be alphabetical, numeric, or however.
     2. Unordered Lists : where items are stored in an unordered way, that might be shown after dot, hyphen, etc. -->
    <ul>
        <li>OS</li>
        <li>DBMS</li>
        <li>OOPS</li>
        <li>CN</li>
    </ul>
    <br>
    <ol>
        <li>CN</li>
        <li>OS</li>
        <li>DBMS</li>
        <li>OOPS</li>
    </ol>
</body>
</html>
