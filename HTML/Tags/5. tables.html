<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table Related Tags</title>
  </head>
  <body>
    <table border="1px">
      <tr>
        <th>Name</th>
        <th>Age</th>
        <th>Salary</th>
      </tr>
      <tr>
        <td>John</td>
        <td>31</td>
        <td>20k</td>
      </tr>
      <tr>
        <td>Adam</td>
        <td>31</td>
        <td>30k</td>
      </tr>
      <tr>
        <td>Chris</td>
        <td>27</td>
        <td>49k</td>
      </tr>
    </table>
    <!-- Table is used to create table format of data.
     tr is used to add table row.
     td is used to add table data.
     and
     th is used to add table heading. -->
  </body>
</html>
