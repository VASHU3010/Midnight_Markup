<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Tag</title>
</head>
<body>
    <img src="https://img.magnific.com/free-vector/random-fun-hand-drawn-doodle-pattern-background_1048-19869.jpg?semt=ais_hybrid&w=740&q=80" alt="Random image from google looks like sprinkles" height="200" width="200">
    <!-- In html , images are used using img tag, 
     where src is used to add source , like anchor tag , here we can add the links.
     and alt is used for alternate texts that can be visible when the link is not working or the unfortunately the source is not available that time.
     and 
     we can adjust height and width by using styling height and width and enter the appropriate height and width pixels. -->
</body>
</html>
